  if(S.miniTimer<=0)terrMiniAward(false,'THE MEMORY FRAGMENTS FADED');
 }
}

];
const terrFrightCamIds = Array.from({length:10},(_,i)=>String(i+1).padStart(2,'0'));
const terrFrightCamLabel = k => String(terrFrightCamIds.indexOf(k)+1).padStart(2,'0');
const terrHouseMapXY = [
 [527,433],[424,946],[324,145],[205,500],[442,580],[424,720],[174,729],[497,151],[420,220],[562,925],[1007,981],[1000,181],[635,247],[823,433],[890,535],[558,520],[583,658],[829,654],[1194,186],[1205,650],[1138,758],[1145,896]
];
const terrFrightMapXY = [[73,315],[296,290],[377,247],[377,183],[224,197],[74,203],[76,139],[184,137],[244,76],[355,108]];
const terrFrightPoint = k => terrFrightMapXY[Math.max(0,terrFrightCamIds.indexOf(k))] || null;

// Map each original UCN route node onto the selected office's numbered camera plan.
const terrCamOfFinalBase = camOf;
camOf = function(a){
 if(!a || a.group==='nightmare' || a.group==='phantom') return null;
 let raw=null;
 if(a.kind==='scrap'){ raw=terrCamOfFinalBase(a); }
 else {
  const route=(a.route&&a.route.length)?a.route:(CAMT[a.ck]||[]);
  if(route.length) raw=route[Math.min(Math.max(0,a.stage|0),route.length-1)];
  else raw=terrCamOfFinalBase(a);
 }
 if(!raw) return null;
 const idx=CAMN.indexOf(raw);
 if(idx<0) return null;
 if(S.officeChoice==='FNAF3') return String((idx%10)+1).padStart(2,'0');
 if(S.officeChoice==='FNAF4') return String(Math.min(21,idx)+1).padStart(2,'0');
 return terrCamOfFinalBase(a);
};
terrMapCams = function(){return S.officeChoice==='FNAF4'?terrAftonCams:S.officeChoice==='FNAF3'?terrFrightCamIds:CAMN};
terrMapPoint = function(k){
 if(S.officeChoice==='FNAF4'){const p=terrHousePoint(k);return p?[80+p[0]/1363*640,120+p[1]/1057*496]:null}
 if(S.officeChoice==='FNAF3'){const p=terrFrightPoint(k);return p?[120+p[0]/440*490,120+p[1]/440*490]:null}
 const v=CAMPOS[k];return v?[DM.x+v[0]*DM.s,DM.y+v[1]*DM.s]:null;
};

// Make sure the complete Nightmare 4 roster includes Plushtrap.
let terrPlushtrap = ROSTER.find(a=>a.id==='plushtrap');
if(!terrPlushtrap){
 terrPlushtrap={id:'plushtrap',name:'Plushtrap',group:'nightmare',color:'#7b7862',kind:'nightmare',ai:0,interval:8.5,stage:0,t:0,tm:0,wake:24,gen:0,side:'L',_terrClock:0};
 ROSTER.push(terrPlushtrap);
}
terrPlushtrap.ai = save.ai?.plushtrap ?? terrPlushtrap.ai ?? 0;
terrPlushtrap.opp=function(a){if(a.ai<=0||a.stage>0)return;a.stage=3;a.tm=0;a._terrDoorSide='L';a._terrPlushWindow=1.4;say('PLUSHTRAP IN THE LEFT HALL — TIME YOUR FLASH!');tone(125,.2,'sawtooth',.14,-.7)};
terrPlushtrap.upd=function(a,dt){
 if(a.ai<=0){a.stage=0;a._terrClock=0;return}
 if(a.stage<=0){a._terrClock=(a._terrClock||0)+dt;if(a._terrClock>=Math.max(5,a.interval*(1.2-a.ai/28))){a._terrClock=0;if(Math.random()<a.ai/20)a.opp(a)}return}
 a.tm+=dt;
 if(S.lightOn && S.face==='L' && a.tm>=.45 && a.tm<=2.2){a.stage=0;a.tm=0;say('PLUSHTRAP CAUGHT IN THE FLASHLIGHT');tone(360,.1,'square',.12);return}
 if(a.tm>3.4)scare(a);
};
INFO.plushtrap=['Plushtrap creeps into the left hall and waits for a chance to move.','Use a short flashlight burst at the right moment to send him back.'];

// Replace the lethal Phantom outcome with a short jumpscare + temporary disruption. A Phantom can NEVER end the night.
function terrSafeResetPhantom(a){a.stage=0;a.tm=0;a.mat=0;a._terrClock=0;a._terrLight=0;a._terrPending=0;a._terrPhantomActive=false;}
terrResetPhantom = terrSafeResetPhantom;
function terrTriggerPhantomJumpscare(a){
 terrBreakFromPhantom(a);
 S._terrPhantomScare={id:a.id,name:a.name,color:a.color||'#8ca78c',time:.92,total:.92};
 S.noise=Math.min(100,(S.noise||0)+12);
 S.mentalHallucination=Math.max(S.mentalHallucination||0,1.15);
 tone(58,.34,'sawtooth',.24);tone(42,.38,'square',.17);
 a._terrPending=.72;a.stage=2;
}
for(const a of ROSTER.filter(q=>q.group==='phantom')){
 a.kind='phantom';a.gen=0;a.route=[];a.ck=null;a._terrClock=0;
 a.opp=function(q){if(q.ai<=0||q.stage>0||S.blk>0)return;q.stage=1;q.mat=.03;q.tm=0;q._terrLight=0;q._terrPending=0;q.ox=clamp(S.camX+250+Math.random()*760,150,WORLD-150);q._terrPhantomActive=true;say(q.name.toUpperCase()+' IS MATERIALIZING — FLASH IT!');tone(170,.16,'sawtooth',.11)};
 a.upd=function(q,dt){
  if(q.ai<=0){terrSafeResetPhantom(q);return}
  if(S.mode!=='PLAYING')return;
  if(q._terrPending>0){q._terrPending-=dt;if(q._terrPending<=0)terrSafeResetPhantom(q);return}
  if(q.stage<=0){q._terrClock=(q._terrClock||0)+dt;const interval=Math.max(4.5,(q.interval||8)*(1.18-q.ai/26));if(q._terrClock>=interval){q._terrClock=0;if(Math.random()<q.ai/20)q.opp(q)}return}
  q.mat=clamp((q.mat||0)+dt*(.7+q.ai*.035),0,1);
  const aimView=S.face==='L'?300:S.face==='R'?980:(terrJoy.pid!=null?640+terrJoy.x*140:(S.touch?640:S.mx));
  const inBeam=!!(S.lightOn&&!S.mon&&Math.abs((q.ox||S.camX+640)-(S.camX+aimView))<420);
  if(inBeam){q._terrLight=(q._terrLight||0)+dt;if(q._terrLight>=.42){terrSafeResetPhantom(q);say(q.name+' FADES UNDER THE FLASHLIGHT');tone(500,.11,'square',.12);return}}
  else q._terrLight=Math.max(0,(q._terrLight||0)-dt*.45);
  if(q.mat>=1 && !q._terrPending)terrTriggerPhantomJumpscare(q);
 };
}
// Guard against any legacy branch calling scare(phantom).
const terrLethalScareGuard=scare;
scare=function(a){if(a&&a.group==='phantom'){terrTriggerPhantomJumpscare(a);return}return terrLethalScareGuard(a)};

// Ensure menu + character-select use the same supplied selection track.
const terrOldAmbientSync=syncAmbientTracks;
syncAmbientTracks=function(){
 const menuModes=['TITLE','MAIN_MENU','OFFICE_SELECT','MINIGAMES_MENU','HOW_TO_PLAY'];
 const inSelect=menuModes.includes(S.mode);
 const inOffice=(S.mode==='PLAYING'||S.mode==='NIGHT_INTRO')&&S.fan&&!S.out;
 const st=customSFX.selection||selectionTrack,ft=customSFX.officefan||officeFanTrack;
 syncLoopTrack(st,inSelect,.42);syncLoopTrack(ft,inOffice,.22);
 if(customSFX.selection&&customSFX.selection!==st&&!customSFX.selection.paused)customSFX.selection.pause();
 if(customSFX.officefan&&customSFX.officefan!==ft&&!customSFX.officefan.paused)customSFX.officefan.pause();
};

<script>
/* ===== js/07-ai-and-equipment-patch.js ===== */
// ===== PATCH: Phantom nerf + flashlight fix, 15s activation for everyone, Music Box button in the camera monitor (Fright + Afton's House) =====
(function(){
'use strict';
const ACTIVE_AT=15;                       // every animatronic becomes active exactly 15s into the night
const phantoms=()=>ROSTER.filter(a=>a.group==='phantom');
const lit=()=>!!(S.lightOn&&!S.mon&&!S.settings&&!S.ducts&&!S.mask);
const onScreen=q=>{const sx=(q.ox||0)-S.camX;return sx>-30&&sx<W+30};
const gate0=()=>ACTIVE_AT+12;

function phReset(q){q.stage=0;q.tm=0;q.mat=0;q._terrClock=0;q._terrLight=0;q._terrPending=0;q._terrPhantomActive=false;q._phWind=0}
function phVanish(q,msg){say(msg);tone(500,.11,'square',.12);phReset(q)}

for(const a of phantoms()){
  a.opp=function(q){
    if(q.ai<=0||q.stage>0||S.blk>0)return;
    if(S.time<ACTIVE_AT||S.time<(S._phGate==null?gate0():S._phGate))return;
    if(phantoms().some(p=>p!==q&&p.stage>0))return;            // never more than one Phantom at a time
    q.stage=1;q.mat=.03;q.tm=0;q._terrLight=0;q._terrPending=0;q._phWind=0;
    q.ox=clamp(S.camX+330+Math.random()*620,150,WORLD-150);      // always spawns well inside your view
    q._terrPhantomActive=true;
    S._phGate=S.time+30+Math.random()*20;                        // 30-50s breather before the next Phantom
    say(q.name.toUpperCase()+' IS MATERIALIZING — FLASH IT!');tone(170,.16,'sawtooth',.11);
  };
  a.upd=function(q,dt){
    if(q.ai<=0){phReset(q);return}
    if(S.mode!=='PLAYING'||S.time<ACTIVE_AT)return;
    if(q._terrPending>0){q._terrPending-=dt;if(q._terrPending<=0)phReset(q);return}
    if(q.stage<=0){
      if(S.time<(S._phGate==null?gate0():S._phGate))return;
      if(phantoms().some(p=>p!==q&&p.stage>0))return;
      q._terrClock=(q._terrClock||0)+dt;
      const interval=Math.max(9,(q.interval||8)*(1.5-q.ai/30));
      if(q._terrClock>=interval){q._terrClock=0;if(Math.random()<q.ai/20*.55)q.opp(q)}
      return;
    }
    // Music box lulls the Phantom Puppet (hold WIND in the camera monitor)
    if(q.id==='phantom-puppet'&&S.mon&&S.hk==='wind'){
      q._phWind=(q._phWind||0)+dt;q.mat=Math.max(0,q.mat-dt*1.2);
      if(q._phWind>=1.5){phVanish(q,'Phantom Puppet was lulled away by the music box');return}
      return;
    }
    q._phWind=Math.max(0,(q._phWind||0)-dt*.5);
    if(lit()&&onScreen(q)){                                       // flashlight: any Phantom on screen counts, no precise aiming
      q._terrLight=(q._terrLight||0)+dt;q.mat=Math.max(.05,q.mat-dt);
      if(q._terrLight>=.35){phVanish(q,q.name+' FADES UNDER THE FLASHLIGHT');return}
    }else{
      q._terrLight=Math.max(0,(q._terrLight||0)-dt*.2);
      q.mat=clamp((q.mat||0)+dt/(7-Math.min(q.ai,20)*.1)*(S.mon?.5:1),0,1);   // ~5-7s to fully form (half speed while cameras are up)
    }
    if(q.mat>=1&&!q._terrPending)scare(q);                        // non-lethal phantom jumpscare + system disruption
  };
}

// Every animatronic's custom per-frame logic waits for the 15s mark too (puppet drain, freddles, etc.)
for(const a of ROSTER){
  if(typeof a.upd!=='function'||a._act15)continue;
  const u=a.upd;a._act15=true;
  a.upd=function(q,dt){if(S.mode==='PLAYING'&&S.time<ACTIVE_AT)return;return u.call(this,q,dt)};
}

// Phantoms are driven only by their own timer above (the old per-interval roll made them stack up)
const prevOppRoll=oppRoll;
oppRoll=function(a,dt,hr){if(a&&a.group==='phantom')return;return prevOppRoll(a,dt,hr)};

const baseStart=startNight;
startNight=function(){
  baseStart();

  for(const a of phantoms())phReset(a);

};

const MB={x:810,y:566,w:435,h:54};

  c.restore();
};

// The old canvas-drawn maintenance panel is retired: nothing is drawn or tapped on the canvas for it any more.
BR.setMaintenanceDraw(function(){});
BR.setPanelTap(function(){});

// Maintenance systems and the actions each one really supports.
const UCN_SYSTEMS=[
 {key:'CameraSystem',      label:'/Camera system',     actions:['reboot']},
 {key:'Ventilation',       label:'/Ventilation',       actions:['activate','deactivate','reboot']},
 {key:'SilentVentilation', label:'/Silent ventilation',actions:['activate','deactivate']},
 {key:'Heater',            label:'/Heater',            actions:['activate','deactivate']},
 {key:'AC',                label:'/A/C',               actions:['activate','deactivate']},
 {key:'Generator',         label:'/Generator',         actions:['activate','deactivate','reboot']},
 {key:'GlobalMusicBox',    label:'/Global music box',  actions:['activate','deactivate']},
 {key:'SoundDevice',       label:'/Sound device',      actions:['reboot']}
];
const ACTION_HELP={
 'CameraSystem-reboot':'Repairs a damaged camera system. Controls lock for 4.8 seconds while it reboots.',
 'Ventilation-activate':'Turns the ventilation fan on. Fails while the ventilation circuit is damaged.',
 'Ventilation-deactivate':'Turns the ventilation fan off.',
 'Ventilation-reboot':'Repairs a damaged ventilation circuit. Controls lock for 4.8 seconds.',
 'SilentVentilation-activate':'Runs silent ventilation, which steadily lowers noise.',
 'SilentVentilation-deactivate':'Turns silent ventilation off.',
 'Heater-activate':'Fires a 5-second heater blast that pushes back duct crawlers and raises temperature. 22-second cooldown.',
 'Heater-deactivate':'Stops the heater\'s ongoing heat output. The cooldown keeps running.',
 'AC-activate':'Runs power A/C for 6 seconds to bring temperature down. 28-second recharge.',
 'AC-deactivate':'Stops power A/C early. The recharge keeps running.',
 'Generator-activate':'Starts the generator, which adds power while it runs.',
 'Generator-deactivate':'Stops the generator.',
 'Generator-reboot':'Power-cycles the generator: it shuts down and comes back online after 3 seconds.',
 'GlobalMusicBox-activate':'Turns on the Global Music Box. Slows music-sensitive threats and drains power faster.',
 'GlobalMusicBox-deactivate':'Turns off the Global Music Box.',
 'SoundDevice-reboot':'Repairs a damaged sound device (needed for the audio lure). Controls lock for 4.8 seconds.'
};

const $=id=>document.getElementById(id);
const R=(ok,msg)=>({ok:ok,msg:msg});
const legacyCam=()=>Object.keys(S.brk||{}).length>0||S.rb>0;

// Every command is wired to the same game state and functions the old panel used.
const EXEC={
 'CameraSystem-reboot':q=>{
   if(!(q.cameraBroken||legacyCam())) return R(false,'CAMERA SYSTEM IS ALREADY ONLINE');
   q.cameraBroken=true; BR.beginReboot('camera');
   return R(true,'CAMERA SYSTEM REBOOT STARTED');
 },
 'Ventilation-activate':q=>{
   if(q.ventBroken) return R(false,'VENTILATION OFFLINE - REBOOT IT FIRST');
   if(S.vent) return R(false,'VENTILATION IS ALREADY ACTIVE');
   S.vent=true; say('VENTILATION ONLINE');
   return R(true,'VENTILATION ACTIVATED');
 },
 'Ventilation-deactivate':q=>{
   if(!S.vent) return R(false,'VENTILATION IS ALREADY OFF');
   S.vent=false; say('VENTILATION OFF');
   return R(true,'VENTILATION DEACTIVATED');
 },
 'Ventilation-reboot':q=>{
   if(!q.ventBroken) return R(false,'VENTILATION CIRCUIT IS ALREADY ONLINE');
   BR.beginReboot('vent');
   return R(true,'VENTILATION CIRCUIT REBOOT STARTED');
 },
 'SilentVentilation-activate':q=>{
   if(q.silentVentOn) return R(false,'SILENT VENTILATION IS ALREADY ACTIVE');
   q.silentVentOn=true; say('SILENT VENTILATION ENABLED');
   return R(true,'SILENT VENTILATION ACTIVATED');
 },
 'SilentVentilation-deactivate':q=>{
   if(!q.silentVentOn) return R(false,'SILENT VENTILATION IS ALREADY OFF');
   q.silentVentOn=false; say('SILENT VENTILATION DISABLED');
   return R(true,'SILENT VENTILATION DEACTIVATED');
 },
 'Heater-activate':q=>{
   if(q.heaterCooldown>0) return R(false,'HEATER COOLING DOWN - '+Math.ceil(q.heaterCooldown)+'s');
   BR.useHeater();
   return R(true,'HEATER ACTIVATED - 5s BLAST');
 },
 'Heater-deactivate':q=>{
   if(!(q.heaterOn>0)) return R(false,'HEATER IS NOT RUNNING');
   q.heaterOn=0;
   return R(true,'HEATER DEACTIVATED - COOLDOWN CONTINUES');
 },
 'AC-activate':q=>{
   if(S.cool>0) return R(false,'A/C IS ALREADY COOLING');
   if(q.acCooldown>0) return R(false,'A/C RECHARGING - '+Math.ceil(q.acCooldown)+'s');
   S.cool=6; q.acCooldown=28; say('POWER A/C RUNNING - TEMPERATURE FALLING');
   return R(true,'A/C ACTIVATED - 6s COOLING');
 },
 'AC-deactivate':q=>{
   if(!(S.cool>0)) return R(false,'A/C IS NOT RUNNING');
   S.cool=0;
   return R(true,'A/C DEACTIVATED - RECHARGE CONTINUES');
 },
 'Generator-activate':q=>{
   if(q.genRebootLeft>0) return R(false,'GENERATOR IS POWER-CYCLING');
   if(q.generatorOn) return R(false,'GENERATOR IS ALREADY ONLINE');
   q.generatorOn=true; say('POWER GENERATOR ONLINE');
   return R(true,'GENERATOR ACTIVATED');
 },
 'Generator-deactivate':q=>{
   if(q.genRebootLeft>0) return R(false,'GENERATOR IS POWER-CYCLING');
   if(!q.generatorOn) return R(false,'GENERATOR IS ALREADY OFF');
   q.generatorOn=false; say('POWER GENERATOR OFF');
   return R(true,'GENERATOR DEACTIVATED');
 },
 'Generator-reboot':q=>{
   if(q.genRebootLeft>0) return R(false,'GENERATOR IS ALREADY POWER-CYCLING');
   q.generatorOn=false; q.genRebootLeft=3; say('POWER GENERATOR REBOOTING');
   return R(true,'GENERATOR REBOOT STARTED - BACK ONLINE IN 3s');
 },
 'GlobalMusicBox-activate':q=>{
   if(S.globalMusicBox) return R(false,'GLOBAL MUSIC BOX IS ALREADY ON');
   toggleGlobalMusicBox();
   return R(true,'GLOBAL MUSIC BOX ACTIVATED');
 },
 'GlobalMusicBox-deactivate':q=>{
   if(!S.globalMusicBox) return R(false,'GLOBAL MUSIC BOX IS ALREADY OFF');
   toggleGlobalMusicBox();
   return R(true,'GLOBAL MUSIC BOX DEACTIVATED');
 },
 'SoundDevice-reboot':q=>{
   if(!q.audioBroken) return R(false,'SOUND DEVICE IS ALREADY ONLINE');
   BR.beginReboot('audio');
   return R(true,'SOUND DEVICE REBOOT STARTED');
 }
};

function rebootAll(q){
 if(!(q.audioBroken||q.cameraBroken||q.ventBroken||legacyCam())) return R(false,'ALL SYSTEMS ARE ALREADY ONLINE');
 if(legacyCam()) q.cameraBroken=true;
 BR.beginReboot('all');
 return R(true,'REBOOT ALL DAMAGED SYSTEMS STARTED');
}

// Returns [status text, css class] for the status indicator list.
function ucnStatusOf(key,q){
 const rb=k=>q.rebooting>0&&(q.rebootTarget===k||q.rebootTarget==='all');
 switch(key){
  case 'CameraSystem':
   if(rb('camera')) return ['REBOOTING','warn'];
   if(q.cameraBroken||legacyCam()) return ['DAMAGED','bad'];
   return ['ONLINE',''];
  case 'Ventilation':
   if(rb('vent')) return ['REBOOTING','warn'];
   if(q.ventBroken) return ['OFFLINE','bad'];
   return S.vent?['ON','']:['OFF','off'];
  case 'SilentVentilation':
   return q.silentVentOn?['ACTIVE','']:['OFF','off'];
  case 'Heater':
   if(q.heaterCooldown>0) return [q.heaterOn>0?'HEATING '+Math.ceil(q.heaterOn)+'s':'COOLDOWN '+Math.ceil(q.heaterCooldown)+'s','warn'];
   return ['READY','off'];
  case 'AC':
   if(S.cool>0) return ['COOLING '+Math.ceil(S.cool)+'s','warn'];
   if(q.acCooldown>0) return ['RECHARGE '+Math.ceil(q.acCooldown)+'s','warn'];
   return ['READY','off'];
  case 'Generator':
   if(q.genRebootLeft>0) return ['CYCLING '+Math.ceil(q.genRebootLeft)+'s','warn'];
   return q.generatorOn?['ONLINE','']:['OFF','off'];
  case 'GlobalMusicBox':
   return S.globalMusicBox?['ON','']:['OFF','off'];
  case 'SoundDevice':
   if(rb('audio')) return ['REBOOTING','warn'];
   return q.audioBroken?['DAMAGED','bad']:['ONLINE',''];
 }
 return ['--','off'];
}

let out,inp,tab,sysBox;
const refs={};
const history=[];
let histIdx=0;

function ucnLog(text,cls){
 const d=document.createElement('div');
 d.className='l'+(cls?' '+cls:'');
 d.textContent=text;
 out.appendChild(d);
 while(out.childNodes.length>400) out.removeChild(out.firstChild);
 out.scrollTop=out.scrollHeight;
}
function ucnBeep(ok){try{ok?tone(660,.07,'square',.06):tone(180,.12,'square',.07)}catch(e){}}

function ucnHelp(){
 ucnLog('AVAILABLE COMMANDS','hd');
 ucnLog('Format: /DDRS-[system]-[action]','ds');
 ucnLog('Actions: reboot, activate, deactivate','ds');
 ucnLog('Example: /DDRS-Ventilation-activate','ds');
 for(const s of UCN_SYSTEMS){
   for(const a of s.actions){
     const k=s.key+'-'+a, cmd='/DDRS-'+k;
     ucnLog(cmd,'cm');
     ucnLog(ACTION_HELP[k],'ds');
     ucnLog('Usage: '+cmd,'ds dim');
   }
 }
 ucnLog('TERMINAL COMMANDS','hd');
 ucnLog('?','cm');ucnLog('Shows this list.','ds');
 ucnLog('/reboot-all','cm');ucnLog('Reboots every damaged system at once (camera, ventilation, sound device).','ds');
 ucnLog('/history','cm');ucnLog('Lists your recent commands. Type !1 (or !2, !3...) to run one again.','ds');
 ucnLog('/clear','cm');ucnLog('Clears the terminal output.','ds');
 ucnLog('/exit','cm');ucnLog('Closes the panel and returns to the office.','ds');
}

function ucnPushHistory(text){
 if(history[history.length-1]!==text) history.push(text);
 if(history.length>40) history.shift();
 histIdx=history.length;
}

function ucnExec(key,act){
 const q=S._terrSec;
 if(!q) return R(false,'TERMINAL OFFLINE');
 if(q.rebooting>0) return R(false,'CONTROLS LOCKED DURING REBOOT');
 return EXEC[key+'-'+act](q);
}

function ucnClose(){S._securityPanel=false;ucnSync()}

function ucnCommand(raw,fromBang){
 const text=String(raw==null?'':raw).trim();
 if(!text) return;
 ucnLog('> '+text,'in');
 if(!fromBang) ucnPushHistory(text);
 const low=text.toLowerCase();

 if(text==='?'){ucnHelp();return}
 if(low==='/clear'){out.textContent='';return}
 if(low==='/exit'){ucnClose();return}
 if(low==='/history'){
   if(!history.length){ucnLog('NO COMMANDS YET','dim');return}
   const start=Math.max(0,history.length-15);
   for(let i=start;i<history.length;i++) ucnLog((i+1)+'  '+history[i],'ds');
   ucnLog('Type !<number> to run one again.','dim');
   return;
 }
 const bang=/^!(\d+)$/.exec(text);
 if(bang){
   const n=parseInt(bang[1],10);
   if(n<1||n>history.length||history[n-1].charAt(0)==='!'){ucnLog('NO HISTORY ENTRY '+n,'err');ucnBeep(false);return}
   ucnCommand(history[n-1],true);
   return;
 }
 if(low==='/reboot-all'){
   const q=S._terrSec;
   const r=!q?R(false,'TERMINAL OFFLINE'):q.rebooting>0?R(false,'CONTROLS LOCKED DURING REBOOT'):rebootAll(q);
   ucnLog((r.ok?'[ OK ] ':'[ ERR ] ')+r.msg,r.ok?'':'err');ucnBeep(r.ok);ucnRender();
   return;
 }

 const m=/^\/DDRS-([A-Za-z]+)-([A-Za-z]+)$/i.exec(text);
 if(!m){ucnLog('SYNTAX ERROR - FORMAT IS /DDRS-[system]-[action]. TYPE ? FOR HELP.','err');ucnBeep(false);return}
 const sys=UCN_SYSTEMS.find(s=>s.key.toLowerCase()===m[1].toLowerCase());
 if(!sys){ucnLog('UNKNOWN SYSTEM "'+m[1]+'". TYPE ? FOR A LIST OF SYSTEMS.','err');ucnBeep(false);return}
 const act=m[2].toLowerCase();
 if(!['reboot','activate','deactivate'].includes(act)){ucnLog('UNKNOWN ACTION "'+m[2]+'". USE reboot, activate OR deactivate.','err');ucnBeep(false);return}
 if(!sys.actions.includes(act)){ucnLog(sys.key+' DOES NOT SUPPORT "'+act+'". VALID: '+sys.actions.join(', ')+'. TYPE ? FOR HELP.','err');ucnBeep(false);return}
 const r=ucnExec(sys.key,act);
 ucnLog((r.ok?'[ OK ] ':'[ ERR ] ')+r.msg,r.ok?'':'err');
 ucnBeep(r.ok);
 ucnRender();
}

function ucnBuild(){
 sysBox.textContent='';
 const row=(label,cls)=>{
   const d=document.createElement('div');d.className='sr'+(cls?' '+cls:'');
   const n=document.createElement('span');n.className='sn';n.textContent=label;
   const v=document.createElement('span');v.className='sv';
   d.append(n,v);sysBox.appendChild(d);
   return {d,v};
 };
 for(const s of UCN_SYSTEMS) refs[s.key]=row(s.label);
 refs._pw=row('/Power','pw');
 refs._tp=row('/Temperature');
}
function ucnRender(){
 const q=S._terrSec;
 if(!q) return;
 for(const s of UCN_SYSTEMS){
   const st=ucnStatusOf(s.key,q),r=refs[s.key];
   r.v.textContent=st[0];
   r.d.className='sr'+(st[1]?' '+st[1]:'');
 }
 const pw=Math.max(0,Math.ceil(S.power));
 const blocks=Math.max(0,Math.min(10,Math.round(Math.min(100,pw)/10)));
 refs._pw.v.textContent='\u2588'.repeat(blocks)+'\u2591'.repeat(10-blocks)+' '+pw+'%';
 refs._tp.v.textContent=Math.round(S.heat)+'\u00B0C';
 let top=pw+'% - Power';
 if(q.rebooting>0) top='REBOOT '+q.rebooting.toFixed(1)+'s - LOCKED';
 $('ucnTop').textContent=top;
}

// Keep the monitor sized to what is really visible so the on-screen keyboard never covers the input line.
function fitVV(){
 const v=window.visualViewport;
 if(!v){return}
 tab.style.top=v.offsetTop+'px';
 tab.style.left=v.offsetLeft+'px';
 tab.style.width=v.width+'px';
 tab.style.height=v.height+'px';
 tab.classList.toggle('cmp',v.height<340);
}

let wasOpen=false;
function ucnSync(){
 const q=S&&S._terrSec;
 const open=!!(q&&S._securityPanel&&S.mode==='PLAYING');
 if(open!==wasOpen){
   wasOpen=open;
   tab.hidden=!open;
   if(open){
     fitVV();
     if(!out.childNodes.length){
       ucnLog('DDRS MAINTENANCE TERMINAL READY','dim');
       ucnLog('TYPE "?" TO FIND ALL AVAILABLE COMMANDS','');
     }
     ucnRender();
     try{inp.focus({preventScroll:true})}catch(e){}
   }else{try{inp.blur()}catch(e){}}
 }
 if(open) ucnRender();
}

function ucnInit(){
 tab=$('ucnTablet');out=$('ucnOut');inp=$('ucnTermIn');sysBox=$('ucnSys');
 ucnBuild();

 inp.addEventListener('keydown',e=>{
   e.stopPropagation(); // keep typed letters and digits away from the game's own keys
   if(e.key==='Enter'){
     e.preventDefault();
     const v=inp.value;inp.value='';ucnCommand(v);
   }else if(e.key==='ArrowUp'){
     e.preventDefault();
     if(histIdx>0){histIdx--;inp.value=history[histIdx]}
   }else if(e.key==='ArrowDown'){
     e.preventDefault();
     if(histIdx<history.length-1){histIdx++;inp.value=history[histIdx]}
     else{histIdx=history.length;inp.value=''}
   }else if(e.key==='Escape'){
     e.preventDefault();ucnClose();
   }
 });
 inp.addEventListener('keyup',e=>e.stopPropagation());
 // Tapping the monitor (not dragging) brings the keyboard back.
 tab.addEventListener('click',()=>{try{inp.focus({preventScroll:true})}catch(e){}});

 if(window.visualViewport){
   visualViewport.addEventListener('resize',fitVV);
   visualViewport.addEventListener('scroll',fitVV);
 }
 addEventListener('resize',fitVV);
 setInterval(ucnSync,120);
}

// Generator power-cycle timer (the Generator-reboot command). Runs with the game's normal update loop.
const ucnPrevUpdate=update;
update=function(dt){
 ucnPrevUpdate(dt);
 const q=S._terrSec;
 if(q&&S.mode==='PLAYING'&&q.genRebootLeft>0){
   q.genRebootLeft=Math.max(0,q.genRebootLeft-dt);
   if(q.genRebootLeft===0){q.generatorOn=true;say('POWER GENERATOR BACK ONLINE')}
 }
};

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',ucnInit);
else ucnInit();
})();
</script>
</body></html>
