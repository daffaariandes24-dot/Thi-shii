name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and fix game folder
        run: |
          if [ ! -f www/index.html ]; then
            NESTED=$(find . -maxdepth 3 -path "*/www/index.html" -not -path "./node_modules/*" | head -1)
            if [ -n "$NESTED" ]; then
              DIR=$(dirname "$(dirname "$NESTED")")
              echo "Found the game files in $DIR, moving them to the top level"
              cp -r "$DIR"/. .
              rm -rf "$DIR"
            fi
          fi
          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html still not found"; find . -maxdepth 3 -not -path "./.git*" | head -40; exit 1
          fi
          echo "Game files ready"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Install launcher icons
        run: |
          if [ -d android-icons ]; then
            cp -r android-icons/. android/app/src/main/res/
            echo "Launcher icons copied"
          else
            echo "WARNING: android-icons folder not found, using the default icon"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2D-UCN-fan-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
